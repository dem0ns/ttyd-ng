name: ttyd
adopt-info: ttyd
summary: Share your terminal over the web (ttyd-ng)
description: |
 ttyd-ng is a community-maintained fork of ttyd, a simple command-line tool
 for sharing a terminal over the web.

grade: stable
confinement: classic
base: core20
compression: lzo

license: MIT

assumes:
  - command-chain

apps:
  ttyd:
    command: usr/bin/ttyd
    command-chain: 
      - bin/homeishome-launch       

parts:
  ttyd:
    # Build the tree this snapcraft.yaml lives in, not an upstream checkout.
    source: .
    source-type: local
    plugin: cmake
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
    build-environment:
      - LDFLAGS: "-pthread"
      
    override-pull: |
      snapcraftctl pull
      snapcraftctl set-version "$(grep -m1 '^project' CMakeLists.txt | awk '{print $3}')"
      
    build-packages:
      - build-essential 
      - libjson-c-dev 
      - libwebsockets-dev
      
    stage-packages:
      - libjson-c4
      - libwebsockets15
      
  homeishome-launch:
    plugin: nil
    stage-snaps:
      - homeishome-launch  
