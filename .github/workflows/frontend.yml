name: frontend

on:
  workflow_dispatch:
  push:
    paths:
    - ".github/workflows/frontend.yml"
    - "html/**"
    - "src/html.h"
  pull_request:
    paths:
    - ".github/workflows/frontend.yml"
    - "html/**"
    - "src/html.h"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run yarn install, check and build
        run: |
          corepack enable
          yarn install --immutable
          yarn run check
          yarn run build
        working-directory: html
